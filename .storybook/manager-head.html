<!-- Sage Design System — Storybook Manager Head -->

<!-- Load Rethink Sans (headings/UI), Spectral (body), JetBrains Mono (code) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700&family=Spectral:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>

<style>
  /* ── Sidebar brand title ───────────────────────────────────────────────── */
  #storybook-explorer-menu *,
  [data-nodeid] span,
  .sidebar-header span,
  button[title="Storybook"] span {
    font-family: 'Rethink Sans', system-ui, sans-serif !important;
  }

  /* ── Sidebar tree items ───────────────────────────────────────────────── */
  #storybook-explorer-tree,
  #storybook-explorer-tree * {
    font-family: 'Rethink Sans', system-ui, sans-serif !important;
  }

  /* ── Toolbar & addons panel ───────────────────────────────────────────── */
  #storybook-panel-root,
  .os-content,
  [role="tablist"] {
    font-family: 'Rethink Sans', system-ui, sans-serif !important;
  }

  /* ── Sage sidebar accent: left border on active story ────────────────── */
  [data-selected="true"] > a,
  [aria-current="page"] {
    border-left: 3px solid #A9C1A9 !important;
    background-color: rgba(169, 193, 169, 0.15) !important;
    color: #1E526F !important;
    font-weight: 600 !important;
    border-radius: 0 4px 4px 0 !important;
  }

  /* ── Hover state ──────────────────────────────────────────────────────── */
  #storybook-explorer-tree a:hover {
    background-color: rgba(169, 193, 169, 0.1) !important;
    color: #1E526F !important;
  }

  /* ── Search input ──────────────────────────────────────────────────────── */
  input[placeholder*="Find"] {
    background-color: #FFFDFA !important;
    border-color: rgba(89, 85, 75, 0.15) !important;
    color: #1B2323 !important;
    border-radius: 4px !important;
  }

  /* ── Scrollbar — sage tinted ───────────────────────────────────────────── */
  ::-webkit-scrollbar {
    width: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #EDF3ED;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(169, 193, 169, 0.6);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #A9C1A9;
  }
</style>
